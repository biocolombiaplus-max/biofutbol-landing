<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panel administrativo | BioFutbol</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="admin.css">
<style>
.group-row td{background:rgba(255,255,255,.03);color:var(--gray-d);font-size:.72rem;font-weight:800;letter-spacing:.04em;padding:9px 16px;cursor:default}
.group-row:hover td{background:rgba(255,255,255,.03)}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 100 140"><rect x="4" y="4" width="92" height="132" rx="24" fill="#0B1626" stroke="#18A83A" stroke-width="5"/><rect x="16" y="26" width="68" height="90" rx="6" fill="#18A83A"/><line x1="16" y1="71" x2="84" y2="71" stroke="#fff" stroke-width="2.4" opacity=".85"/><circle cx="50" cy="71" r="15" fill="none" stroke="#fff" stroke-width="2.4" opacity=".85"/></svg>
      <span class="bio">Bio</span>Futbol
      <span class="badge-admin">Panel administrativo</span>
    </div>
    <div class="top-actions">
      <a href="landing.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-image"></i> Imágenes de la landing</a>
      <a href="auditoria.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-clock-rotate-left"></i> Auditoría</a>
      <span class="user-email" id="userLabel">—</span>
      <button class="btn btn-ghost btn-sm" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="n" id="statTotal">—</div><div class="l">Clubes registrados</div></div>
    <div class="stat ok"><div class="n" id="statActivos">—</div><div class="l">Activos y al día</div></div>
    <div class="stat warn"><div class="n" id="statPorVencer">—</div><div class="l">Pagos por vencer (5d)</div></div>
    <div class="stat bad"><div class="n" id="statVencidos">—</div><div class="l">Pagos vencidos</div></div>
    <div class="stat"><div class="n" id="statSociosTotal">—</div><div class="l">Deportistas registrados</div></div>
  </div>

  <div class="section-head">
    <h2>Clientes</h2>
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar por club o representante...">
      <button class="btn btn-ghost btn-sm" id="copyLinkBtn"><i class="fa-solid fa-link"></i> Copiar mensaje de invitación</button>
      <a href="cliente.html?new=1" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Nuevo cliente</a>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <button type="button" class="btn btn-primary btn-sm" id="filtroTodos" data-filtro="todos"><i class="fa-solid fa-list"></i> Todos (<span id="cnTodos">0</span>)</button>
    <button type="button" class="btn btn-ghost btn-sm" id="filtroClientes" data-filtro="clientes"><i class="fa-solid fa-circle-check"></i> Clientes pagando (<span id="cnClientes">0</span>)</button>
    <button type="button" class="btn btn-ghost btn-sm" id="filtroProspectos" data-filtro="prospectos"><i class="fa-brands fa-whatsapp"></i> Prospectos sin pagar (<span id="cnProspectos">0</span>)</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Club</th>
          <th>Representante</th>
          <th>Plan</th>
          <th>Socios</th>
          <th>Registrados</th>
          <th>Estado</th>
          <th>Próximo pago</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="8" class="empty">Cargando clientes...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/plans.js"></script>
<script src="js/audit.js"></script>
<script>
let TODOS = [];
let SOCIOS_COUNT = {};

requireSuperAdmin().then(function (user) {
  document.getElementById("userLabel").textContent = nombreAdmin(user.email) + " (" + user.email + ")";
  escucharClientes();
});

function escucharClientes() {
  db.collection("clientes").orderBy("fechaRegistro", "desc").onSnapshot(function (snap) {
    TODOS = [];
    snap.forEach(function (doc) { TODOS.push(Object.assign({ id: doc.id }, doc.data())); });
    pintarStats();
    pintarTabla(TODOS);
    cargarConteosSocios();
  }, function (err) {
    document.getElementById("tbody").innerHTML =
      '<tr><td colspan="7" class="empty">Error cargando datos: ' + err.message + '</td></tr>';
  });
}

function cargarConteosSocios() {
  Promise.all(TODOS.map(function (c) {
    return db.collection("clientes").doc(c.id).collection("socios").get().then(function (snap) {
      SOCIOS_COUNT[c.id] = snap.size;
    }).catch(function () { SOCIOS_COUNT[c.id] = null; });
  })).then(function () {
    pintarStats();
    pintarTabla(TODOS);
  });
}

function pintarStats() {
  let activos = 0, porVencer = 0, vencidos = 0, sociosTotal = 0;
  TODOS.forEach(function (c) {
    if (c.estado !== "pendiente" && c.estado !== "inactivo") {
      const dias = diasHasta(c.proximoPago);
      if (dias !== null) {
        if (dias < 0) vencidos++;
        else if (dias <= 5) porVencer++;
        else activos++;
      }
    }
    sociosTotal += SOCIOS_COUNT[c.id] || 0;
  });
  document.getElementById("statTotal").textContent = TODOS.length;
  document.getElementById("statActivos").textContent = activos;
  document.getElementById("statPorVencer").textContent = porVencer;
  document.getElementById("statVencidos").textContent = vencidos;
  document.getElementById("statSociosTotal").textContent = sociosTotal;
}

// Ya es cliente (pagando) cuando tiene al menos un pago registrado —
// sin importar si el estado quedó como "activo" a mano. Todo lo demás
// (registro pendiente por revisar, o activado pero nunca pagó) es un
// prospecto: llegó, pero todavía no se decide.
function esClientePagando(c) {
  return Array.isArray(c.pagos) && c.pagos.length > 0;
}

let filtroActivo = "todos";

function filaCliente(c) {
  const ep = estadoPago(c);
  const registrados = SOCIOS_COUNT[c.id];
  const plan = PLANES[c.plan] ? PLANES[c.plan].label : (c.plan || "—");
  const esCliente = esClientePagando(c);
  const accion = esCliente ? "—" :
    '<button type="button" class="btn btn-primary btn-sm" style="padding:6px 10px;font-size:.72rem" onclick="event.stopPropagation(); animarProspecto(\'' + c.id + '\')"><i class="fa-brands fa-whatsapp"></i> Animar a pagar</button>';
  const referido = c.referidoPorNombre ?
    '<div style="font-size:.68rem;color:var(--gold);font-weight:700;margin-top:2px"><i class="fa-solid fa-gift"></i> Referido por ' + esc(c.referidoPorNombre) + '</div>' : "";
  return '<tr onclick="location.href=\'cliente.html?id=' + c.id + '\'">' +
    '<td><strong>' + esc(c.clubNombre || "Sin nombre") + '</strong>' + referido + '</td>' +
    '<td>' + esc(c.repNombre || "—") + '</td>' +
    '<td>' + esc(plan) + '</td>' +
    '<td>' + (c.numSocios || "—") + '</td>' +
    '<td>' + (registrados === undefined ? '<span class="spinner"></span>' : (registrados === null ? "—" : registrados)) + '</td>' +
    '<td><span class="pill ' + ep.clase + '">' + ep.texto + '</span></td>' +
    '<td>' + formatFecha(c.proximoPago) + '</td>' +
    '<td>' + accion + '</td>' +
    '</tr>';
}

function pintarTabla(lista) {
  const tbody = document.getElementById("tbody");
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">Todavía no hay clientes registrados. Usá "Nuevo cliente" o compartí el link de registro.</td></tr>';
    return;
  }

  const clientes = lista.filter(esClientePagando);
  const prospectos = lista.filter(function (c) { return !esClientePagando(c); });
  document.getElementById("cnTodos").textContent = lista.length;
  document.getElementById("cnClientes").textContent = clientes.length;
  document.getElementById("cnProspectos").textContent = prospectos.length;

  if (filtroActivo === "clientes") {
    tbody.innerHTML = clientes.length ? clientes.map(filaCliente).join("") :
      '<tr><td colspan="8" class="empty">Todavía no tienes clientes pagando.</td></tr>';
    return;
  }
  if (filtroActivo === "prospectos") {
    tbody.innerHTML = prospectos.length ? prospectos.map(filaCliente).join("") :
      '<tr><td colspan="8" class="empty">No hay prospectos pendientes de pago.</td></tr>';
    return;
  }

  // "Todos": primero los que ya pagan, luego los prospectos, separados
  // por un renglón divisor para que se distingan de un vistazo.
  let html = "";
  if (clientes.length) {
    html += '<tr class="group-row"><td colspan="8"><i class="fa-solid fa-circle-check"></i> CLIENTES PAGANDO (' + clientes.length + ')</td></tr>';
    html += clientes.map(filaCliente).join("");
  }
  if (prospectos.length) {
    html += '<tr class="group-row"><td colspan="8"><i class="fa-brands fa-whatsapp"></i> PROSPECTOS SIN PAGAR (' + prospectos.length + ')</td></tr>';
    html += prospectos.map(filaCliente).join("");
  }
  tbody.innerHTML = html;
}

["filtroTodos", "filtroClientes", "filtroProspectos"].forEach(function (id) {
  document.getElementById(id).addEventListener("click", function () {
    filtroActivo = this.dataset.filtro;
    ["filtroTodos", "filtroClientes", "filtroProspectos"].forEach(function (otroId) {
      const btn = document.getElementById(otroId);
      btn.classList.toggle("btn-primary", otroId === id);
      btn.classList.toggle("btn-ghost", otroId !== id);
    });
    pintarTabla(TODOS);
  });
});

function animarProspecto(id) {
  const c = TODOS.find(function (x) { return x.id === id; });
  if (!c) return;
  let tel = (c.repTelefono || "").replace(/[^0-9]/g, "");
  if (!tel) tel = (prompt("¿A qué número de WhatsApp se lo enviamos?") || "").replace(/[^0-9]/g, "");
  if (!tel) return;
  const nombreClub = c.clubNombre || "tu club";
  const mensaje = "¡Hola! Vimos que " + nombreClub + " ya quedó registrado en BioFutbol, pero todavía no hemos recibido tu pago para activar la app.\n\n" +
    "Anímate a modernizar la administración de tu club o escuela: socios, pagos, asistencia, equipos, torneos y mucho más, todo desde el celular — y el manejo es muy sencillo.\n\n" +
    "Cuéntanos si tienes dudas, con gusto te ayudamos a dar el siguiente paso y programamos la capacitación virtual para tu equipo.\n\n" +
    "Quedamos atentos por este mismo chat.";
  window.open("https://wa.me/" + tel + "?text=" + encodeURIComponent(mensaje), "_blank");
  registrarAuditoria("Mensaje de ánimo a pagar enviado por WhatsApp", id, nombreClub, tel);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

document.getElementById("searchInput").addEventListener("input", function (e) {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { pintarTabla(TODOS); return; }
  pintarTabla(TODOS.filter(function (c) {
    return (c.clubNombre || "").toLowerCase().includes(q) || (c.repNombre || "").toLowerCase().includes(q);
  }));
});

function mensajeInvitacionCliente() {
  const url = location.origin + location.pathname.replace(/index\.html$/, "") + "registro.html";
  return "¡Hola! Te escribimos de BioFutbol, la plataforma para modernizar la administración de tu escuela o club de fútbol: socios, pagos, asistencia, equipos, torneos y mucho más, todo desde el celular. Regístrate aquí, te toma solo unos minutos:\n" +
    url + "\n\nCualquier duda, con gusto te ayudamos.";
}

document.getElementById("copyLinkBtn").addEventListener("click", function () {
  navigator.clipboard.writeText(mensajeInvitacionCliente()).then(function () {
    const btn = document.getElementById("copyLinkBtn");
    const original = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-check"></i> ¡Copiado!';
    setTimeout(function () { btn.innerHTML = original; }, 1800);
  });
});
</script>
</body>
</html>
