<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del profesor | BioFutbol</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="admin.css">
<style>
body{background:radial-gradient(900px 480px at 50% -10%,rgba(24,168,58,.16),transparent 60%),var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding:18px 20px 60px}
.topbar-socio{display:flex;justify-content:flex-end;padding-bottom:6px}
.topbar-socio a{color:var(--gray);font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.topbar-socio a:hover{color:var(--white)}
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:22px}
.phead img{width:52px;height:52px;border-radius:50%;object-fit:cover;margin-bottom:4px}
.phead .name{font-size:1.1rem;font-weight:900}
.phead .name b{color:var(--green-l)}
.phead .tag{font-size:.72rem;color:var(--gray-d);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.pcard{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.pcard h3{font-size:.98rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cat-chips{display:flex;flex-wrap:wrap;gap:8px}
.cat-chip{background:var(--card2);border:1px solid var(--card-b2);color:var(--green-l);font-weight:800;font-size:.78rem;padding:6px 14px;border-radius:999px}
.disc-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--card-b2)}
.disc-row:last-child{border-bottom:none}
.disc-row .dr-info{flex:1;min-width:0}
.disc-row .dr-info b{display:block;font-size:.9rem}
.disc-row .dr-info small{color:var(--gray);font-size:.76rem}
.alum-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--card-b2);cursor:pointer}
.alum-row:last-child{border-bottom:none}
.alum-row img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
.alum-row .ar-info{flex:1;min-width:0}
.alum-row .ar-info b{display:block;font-size:.9rem}
.alum-row .ar-info small{color:var(--gray);font-size:.76rem}
.alum-detalle{display:none;background:var(--card2);border:1px solid var(--card-b2);border-radius:12px;padding:14px 16px;margin:-6px 0 12px;font-size:.84rem}
.alum-detalle .ad-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--card-b2)}
.alum-detalle .ad-row:last-child{border-bottom:none}
.alum-detalle .ad-row .k{color:var(--gray)}
.pill.muted{background:rgba(255,255,255,.08);color:var(--gray);border:1px solid rgba(255,255,255,.14)}
.asist-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.asist-chip{display:flex;align-items:center;gap:8px;background:var(--card2);border:1.5px solid var(--card-b2);border-radius:12px;padding:8px 10px;cursor:pointer}
.asist-chip img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0}
.asist-chip span{font-size:.8rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asist-chip .check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--card-b2);display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0;color:transparent}
.asist-chip.presente{border-color:rgba(24,168,58,.5);background:rgba(24,168,58,.08)}
.asist-chip.presente .check{background:var(--green-l);border-color:var(--green-l);color:#04220c}
.asist-chip.ausente{opacity:.55}
.asist-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.asist-contador{font-weight:800;font-size:.9rem}
.asist-live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red,#ff5c5c);margin-right:6px;animation:asistPulse 1.4s ease-in-out infinite}
@keyframes asistPulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="wrap" id="wrap" style="display:none">
  <div class="topbar-socio"><a href="#" id="btnSalir"><i class="fa-solid fa-right-from-bracket"></i> Salir</a></div>
  <div class="phead">
    <img id="clubLogoImg" style="display:none">
    <svg id="clubLogoDefault" width="34" height="42" viewBox="0 0 100 140"><rect x="4" y="4" width="92" height="132" rx="24" fill="#0B1626" stroke="#18A83A" stroke-width="5"/><rect x="16" y="26" width="68" height="90" rx="6" fill="#18A83A"/><line x1="16" y1="71" x2="84" y2="71" stroke="#fff" stroke-width="2.4" opacity=".85"/><circle cx="50" cy="71" r="15" fill="none" stroke="#fff" stroke-width="2.4" opacity=".85"/></svg>
    <div class="name" id="clubNombreTxt">Bio<b>Futbol</b></div>
    <p class="tag" id="profNombreTag">Profesor</p>
  </div>

  <div class="pcard">
    <h3><i class="fa-solid fa-clipboard-list"></i> Mis categorías</h3>
    <div class="cat-chips" id="misCategoriasChips"></div>
  </div>

  <div class="pcard">
    <h3><i class="fa-solid fa-stopwatch"></i> Mi horario</h3>
    <div id="miHorarioLista"><p class="empty">Cargando...</p></div>
  </div>

  <div class="pcard" id="asistenciaCard">
    <h3><i class="fa-solid fa-clipboard-check"></i> Asistencia del entrenamiento</h3>

    <div id="asistenciaSinSesion">
      <div class="field" id="asistCategoriaWrap"><label>Categoría</label><select id="asistCategoria"></select></div>
      <button type="button" class="btn btn-primary btn-block" id="btnActivarEntrenamiento"><i class="fa-solid fa-play"></i> Activar entrenamiento</button>
    </div>

    <div id="asistenciaConSesion" style="display:none">
      <div class="asist-topbar">
        <div><span class="asist-live-dot"></span><b id="asistCategoriaActiva">—</b></div>
        <button type="button" class="btn btn-primary btn-sm" id="btnFinalizarEntrenamiento"><i class="fa-solid fa-flag-checkered"></i> Finalizar</button>
      </div>
      <div class="asist-contador" id="asistContador">0/0 presentes</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button type="button" class="btn btn-ghost btn-sm" id="btnTodosPresentes" style="flex:1">Todos presentes</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btnTodosAusentes" style="flex:1">Todos ausentes</button>
      </div>
      <input type="text" id="asistBuscar" placeholder="Buscar jugador..." style="width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--card-b2);color:var(--white);padding:10px 12px;border-radius:10px;font-size:.86rem">
      <div class="asist-grid" id="asistLista"></div>
    </div>
  </div>

  <div class="pcard">
    <h3><i class="fa-solid fa-users"></i> Mis alumnos</h3>
    <div id="listaAlumnos"><p class="empty">Cargando...</p></div>
  </div>

  <div class="pcard">
    <h3><i class="fa-solid fa-clock-rotate-left"></i> Últimos entrenamientos</h3>
    <div id="listaHistorialEntrenamientos"><p class="empty">Todavía no has finalizado ningún entrenamiento.</p></div>
  </div>
</div>

<div class="wrap" id="errorWrap" style="display:none;text-align:center;padding-top:60px">
  <p style="color:var(--gray)">No se pudo cargar esta información.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/categorias.js"></script>
<script src="js/horarios.js"></script>
<script src="js/festivos.js"></script>
<script src="js/avatar.js"></script>
<script src="js/audit.js"></script>
<script>
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

let profesorActual = null;
let clubActual = null;
let SOCIOS = [];
let SESION_ACTIVA = null;
let HISTORIAL_ENTRENAMIENTOS = [];
let asistBusqueda = "";
let alumnoAbierto = null;

document.getElementById("btnSalir").addEventListener("click", function (e) {
  e.preventDefault();
  cerrarSesionProfesor();
});

requireAccesoProfesor().then(function (r) {
  profesorActual = r.profesor;
  clubActual = r.club || {};
  document.getElementById("wrap").style.display = "block";
  document.getElementById("clubNombreTxt").textContent = clubActual.clubNombre || "BioFutbol";
  if (clubActual.logoUrl) {
    document.getElementById("clubLogoImg").src = clubActual.logoUrl;
    document.getElementById("clubLogoImg").style.display = "block";
    document.getElementById("clubLogoDefault").style.display = "none";
  }
  document.getElementById("profNombreTag").textContent = "Profesor · " + (profesorActual.nombre || "");
  document.title = (profesorActual.nombre || "Profesor") + " | Panel del profesor - BioFutbol";

  const categorias = profesorActual.categorias || [];
  document.getElementById("misCategoriasChips").innerHTML = categorias.length
    ? categorias.map(function (c) { return '<span class="cat-chip">' + esc(c) + '</span>'; }).join("")
    : '<p class="empty">Todavía no tienes categorías asignadas. Pídele al club que te las asigne desde el panel.</p>';

  document.getElementById("asistCategoria").innerHTML = categorias.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join("");
  if (categorias.length <= 1) document.getElementById("asistCategoriaWrap").style.display = "none";

  const clienteId = profesorActual.clienteId;

  Promise.all([
    db.collection("clientes").doc(clienteId).collection("socios").get(),
    db.collection("clientes").doc(clienteId).collection("horarios").get(),
    db.collection("clientes").doc(clienteId).collection("sedes").get(),
    db.collection("clientes").doc(clienteId).collection("excepciones").get().catch(function () { return null; })
  ]).then(function (res) {
    SOCIOS = [];
    res[0].forEach(function (d) { SOCIOS.push(Object.assign({ id: d.id }, d.data())); });
    const horarios = [];
    res[1].forEach(function (d) { horarios.push(Object.assign({ id: d.id }, d.data())); });
    const sedes = {};
    res[2].forEach(function (d) { sedes[d.id] = d.data().nombre; });
    const excepciones = [];
    if (res[3]) res[3].forEach(function (d) { excepciones.push(d.data()); });
    const opts = {
      cancelaciones: excepciones.filter(function (e) { return e.tipo === "cancelacion"; }),
      extras: excepciones.filter(function (e) { return e.tipo === "extra"; }),
      entrenaFestivos: clubActual.entrenaFestivos !== false
    };
    pintarMiHorarioProfesor(horarios, categorias, sedes, opts);
    pintarAlumnos();
  }).catch(function () {
    document.getElementById("miHorarioLista").innerHTML = '<p class="empty">No se pudo cargar el horario.</p>';
    document.getElementById("listaAlumnos").innerHTML = '<p class="empty">No se pudo cargar la lista de alumnos.</p>';
  });

  escucharEntrenamientosProfesor(clienteId, categorias);
}).catch(function () {
  // requireAccesoProfesor ya redirige o muestra la pantalla de bloqueo.
});

function pintarMiHorarioProfesor(horarios, categorias, sedes, opts) {
  const box = document.getElementById("miHorarioLista");
  if (!categorias.length) { box.innerHTML = '<p class="empty">No tienes categorías asignadas todavía.</p>'; return; }
  if (!horarios.length) { box.innerHTML = '<p class="empty">El club todavía no ha programado horarios.</p>'; return; }
  box.innerHTML = categorias.map(function (cat) {
    const resultado = proximoEntrenamiento(horarios, cat, opts);
    let meta = "Sin horario programado";
    if (resultado) {
      meta = formatoProximoEntrenamiento(resultado);
      if (resultado.horario.sedeId && sedes[resultado.horario.sedeId]) meta += " · " + sedes[resultado.horario.sedeId];
      if (resultado.esExtra) meta += " · Entrenamiento especial";
    }
    return '<div class="disc-row"><div class="dr-info"><b>' + esc(cat) + '</b><small>' + esc(meta) + '</small></div></div>';
  }).join("");
}

function alumnosDelProfesor() {
  const categorias = (profesorActual && profesorActual.categorias) || [];
  return SOCIOS.filter(function (s) { return categorias.indexOf(s.categoria) !== -1; });
}

function pintarAlumnos() {
  const box = document.getElementById("listaAlumnos");
  const alumnos = alumnosDelProfesor();
  if (!alumnos.length) { box.innerHTML = '<p class="empty">Todavía no hay alumnos en tus categorías.</p>'; return; }
  box.innerHTML = alumnos.map(function (s) {
    const foto = s.fotoUrl || avatarJerseyDataUrl(clubActual, s.camiseta);
    const asistidos = s.entrenamientosAsistidos || 0, total = s.entrenamientosProgramados || 0;
    const asistTxt = total ? asistidos + "/" + total + " entrenamientos" : "Sin asistencia registrada";
    return '<div>' +
      '<div class="alum-row" onclick="toggleAlumno(\'' + s.id + '\')"><img src="' + foto + '"><div class="ar-info"><b>' + esc(s.nombre || "Sin nombre") + '</b><small>' + esc(s.categoria || "") + ' · ' + esc(asistTxt) + '</small></div><i class="fa-solid fa-chevron-down" style="color:var(--gray)"></i></div>' +
      '<div class="alum-detalle" id="alumDet-' + s.id + '">' +
      '<div class="ad-row"><span class="k">Posición</span><span>' + esc(s.posicion || "—") + '</span></div>' +
      '<div class="ad-row"><span class="k">Pie hábil</span><span>' + esc(s.pieHabil || "—") + '</span></div>' +
      '<div class="ad-row"><span class="k">Camiseta</span><span>' + esc(s.camiseta || "—") + '</span></div>' +
      '<div class="ad-row"><span class="k">Teléfono</span><span>' + esc(s.telefono || "—") + '</span></div>' +
      (s.alergias ? '<div class="ad-row"><span class="k">Alergias</span><span>' + esc(s.alergias) + '</span></div>' : "") +
      (s.emergenciaNombre ? '<div class="ad-row"><span class="k">Emergencia</span><span>' + esc([s.emergenciaNombre, s.emergenciaTelefono].filter(Boolean).join(" · ")) + '</span></div>' : "") +
      '</div></div>';
  }).join("");
  if (alumnoAbierto) toggleAlumno(alumnoAbierto, true);
}

function toggleAlumno(socioId, forzarAbierto) {
  const el = document.getElementById("alumDet-" + socioId);
  if (!el) return;
  const abrir = forzarAbierto || el.style.display !== "block";
  document.querySelectorAll(".alum-detalle").forEach(function (d) { d.style.display = "none"; });
  if (abrir) { el.style.display = "block"; alumnoAbierto = socioId; }
  else { alumnoAbierto = null; }
}

// ── Asistencia en vivo (acotada a las categorías de este profesor) ──
function escucharEntrenamientosProfesor(clienteId, categorias) {
  db.collection("clientes").doc(clienteId).collection("entrenamientos")
    .orderBy("horaInicio", "desc").limit(30)
    .onSnapshot(function (snap) {
      const todos = [];
      snap.forEach(function (d) { todos.push(Object.assign({ id: d.id }, d.data())); });
      SESION_ACTIVA = todos.find(function (e) { return e.estado === "activo" && (!e.categoria || categorias.indexOf(e.categoria) !== -1); }) || null;
      HISTORIAL_ENTRENAMIENTOS = todos.filter(function (e) { return e.estado === "finalizado" && (!e.categoria || categorias.indexOf(e.categoria) !== -1); });
      pintarSesionAsistencia();
      pintarHistorialEntrenamientos();
    }, function () { /* colección sin datos o reglas no publicadas */ });
}

function rosterDeSesion(sesion) {
  return alumnosDelProfesor().filter(function (s) { return !sesion.categoria || s.categoria === sesion.categoria; });
}

function pintarSesionAsistencia() {
  const sinSesion = document.getElementById("asistenciaSinSesion");
  const conSesion = document.getElementById("asistenciaConSesion");
  if (!SESION_ACTIVA) {
    sinSesion.style.display = "block";
    conSesion.style.display = "none";
    return;
  }
  sinSesion.style.display = "none";
  conSesion.style.display = "block";
  document.getElementById("asistCategoriaActiva").textContent = SESION_ACTIVA.categoria || "Todas mis categorías";
  pintarAsistLista();
}

function pintarAsistLista() {
  if (!SESION_ACTIVA) return;
  const roster = rosterDeSesion(SESION_ACTIVA);
  const asistentes = SESION_ACTIVA.asistentes || {};
  const q = asistBusqueda.toLowerCase().trim();
  const filtrado = q ? roster.filter(function (s) { return (s.nombre || "").toLowerCase().includes(q); }) : roster;

  const presentes = roster.filter(function (s) { return asistentes[s.id]; }).length;
  document.getElementById("asistContador").textContent = presentes + "/" + roster.length + " presentes";

  const box = document.getElementById("asistLista");
  if (!filtrado.length) { box.innerHTML = '<p class="empty">No hay jugadores en esta categoría.</p>'; return; }
  box.innerHTML = filtrado.map(function (s) {
    const presente = !!asistentes[s.id];
    const foto = s.fotoUrl || avatarJerseyDataUrl(clubActual, s.camiseta);
    return '<div class="asist-chip ' + (presente ? "presente" : "ausente") + '" onclick="toggleAsistencia(\'' + s.id + '\')">' +
      '<img src="' + foto + '" alt=""><span>' + esc(s.nombre || "Sin nombre") + '</span>' +
      '<div class="check"><i class="fa-solid fa-check"></i></div></div>';
  }).join("");
}

document.getElementById("asistBuscar").addEventListener("input", function () {
  asistBusqueda = this.value;
  pintarAsistLista();
});

function toggleAsistencia(socioId) {
  if (!SESION_ACTIVA) return;
  const nuevoValor = !(SESION_ACTIVA.asistentes && SESION_ACTIVA.asistentes[socioId]);
  SESION_ACTIVA.asistentes = SESION_ACTIVA.asistentes || {};
  SESION_ACTIVA.asistentes[socioId] = nuevoValor;
  pintarAsistLista();
  const campo = "asistentes." + socioId;
  db.collection("clientes").doc(profesorActual.clienteId).collection("entrenamientos").doc(SESION_ACTIVA.id)
    .update({ [campo]: nuevoValor })
    .catch(function (err) { alert("No se pudo guardar: " + err.message); });
}

function marcarTodos(valor) {
  if (!SESION_ACTIVA) return;
  const roster = rosterDeSesion(SESION_ACTIVA);
  const mapa = {};
  roster.forEach(function (s) { mapa[s.id] = valor; });
  SESION_ACTIVA.asistentes = mapa;
  pintarAsistLista();
  db.collection("clientes").doc(profesorActual.clienteId).collection("entrenamientos").doc(SESION_ACTIVA.id)
    .update({ asistentes: mapa })
    .catch(function (err) { alert("No se pudo guardar: " + err.message); });
}

document.getElementById("btnTodosPresentes").addEventListener("click", function () { marcarTodos(true); });
document.getElementById("btnTodosAusentes").addEventListener("click", function () { marcarTodos(false); });

document.getElementById("btnActivarEntrenamiento").addEventListener("click", function () {
  const categorias = profesorActual.categorias || [];
  const categoria = categorias.length === 1 ? categorias[0] : document.getElementById("asistCategoria").value;
  if (!categoria) { alert("Elige una categoría."); return; }
  const roster = alumnosDelProfesor().filter(function (s) { return s.categoria === categoria; });
  if (!roster.length) { alert("No hay alumnos en esa categoría todavía."); return; }
  const asistentes = {};
  roster.forEach(function (s) { asistentes[s.id] = true; });
  const hoy = new Date();
  db.collection("clientes").doc(profesorActual.clienteId).collection("entrenamientos").add({
    fecha: hoy.getFullYear() + "-" + String(hoy.getMonth() + 1).padStart(2, "0") + "-" + String(hoy.getDate()).padStart(2, "0"),
    categoria: categoria,
    sedeId: "",
    estado: "activo",
    horaInicio: firebase.firestore.FieldValue.serverTimestamp(),
    horaFin: null,
    asistentes: asistentes
  }).catch(function (err) { alert("No se pudo activar: " + err.message); });
});

document.getElementById("btnFinalizarEntrenamiento").addEventListener("click", function () {
  if (!SESION_ACTIVA) return;
  if (!confirm("¿Finalizar la toma de asistencia de este entrenamiento?")) return;
  const sesion = SESION_ACTIVA;
  const roster = rosterDeSesion(sesion);
  const asistentes = sesion.asistentes || {};

  const batch = db.batch();
  const ref = db.collection("clientes").doc(profesorActual.clienteId).collection("entrenamientos").doc(sesion.id);
  batch.update(ref, { estado: "finalizado", horaFin: firebase.firestore.FieldValue.serverTimestamp() });
  roster.forEach(function (s) {
    const socioRef = db.collection("clientes").doc(profesorActual.clienteId).collection("socios").doc(s.id);
    batch.update(socioRef, {
      entrenamientosProgramados: firebase.firestore.FieldValue.increment(1),
      entrenamientosAsistidos: firebase.firestore.FieldValue.increment(asistentes[s.id] ? 1 : 0)
    });
  });
  batch.commit().catch(function (err) { alert("No se pudo finalizar: " + err.message); });
});

function nombreCategoriaOTodas(cat) { return cat || "Todas mis categorías"; }

function pintarHistorialEntrenamientos() {
  const box = document.getElementById("listaHistorialEntrenamientos");
  if (!box) return;
  if (!HISTORIAL_ENTRENAMIENTOS.length) { box.innerHTML = '<p class="empty">Todavía no has finalizado ningún entrenamiento.</p>'; return; }
  box.innerHTML = HISTORIAL_ENTRENAMIENTOS.slice(0, 10).map(function (e) {
    const asistentes = e.asistentes || {};
    const total = Object.keys(asistentes).length;
    const presentes = Object.values(asistentes).filter(Boolean).length;
    return '<div class="disc-row"><div class="dr-info"><b>' + esc(nombreCategoriaOTodas(e.categoria)) + '</b><small>' + esc(e.fecha || "") + ' · ' + presentes + '/' + total + ' presentes</small></div></div>';
  }).join("");
}
</script>
</body>
</html>
